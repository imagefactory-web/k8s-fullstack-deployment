# Actual runner scale set
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.13.0
    helm:
      parameters:
        - name: githubConfigUrl
          value: "https://github.com/driveops-surya"
        - name: githubConfigSecret
          value: "github-pat-secret"
        - name: runnerScaleSetName
          value: "arc-runner-set"
        - name: runnerGroup
          value: "default"
        - name: minRunners
          value: "0"
        - name: maxRunners
          value: "5"
        - name: controllerServiceAccount.name
          value: "arc-controller-gha-rs-controller"
        - name: controllerServiceAccount.namespace
          value: "arc-systems"
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: false        # CRITICAL: Don't prune runners [citation:7][citation:9]
      selfHeal: false     # CRITICAL: Disable self-heal [citation:9]
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true