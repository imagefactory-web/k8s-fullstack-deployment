# ArgoCD Root Application (App of Apps Pattern)
#
# Purpose: Bootstrap all applications using the App of Apps pattern
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
   finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
   source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: HEAD
     path: argocd/apps
#
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
#
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
       allowEmpty: false
     syncOptions:
       - CreateNamespace=true
     retry:
       limit: 5
       backoff:
        duration: 5s
         factor: 2
        maxDuration: 3m
# This application watches the argocd/apps directory and automatically
# creates child applications for dev, staging, and prod environments.
