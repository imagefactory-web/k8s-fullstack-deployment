Custom Composite Action: ECR Login
name: 'ECR Login'
description: 'Authenticate with Amazon ECR'
# author: 'Platform Team'
inputs:
  aws-region:
    description: 'AWS region'
     required: false
     default: 'us-east-1'
   aws-access-key-id:
    description: 'AWS Access Key ID'
     required: false
   aws-secret-access-key:
    description: 'AWS Secret Access Key'
     required: false
   role-to-assume:
    description: 'AWS IAM Role ARN to assume (for OIDC)'
     required: false
#
outputs:
   registry:
    description: 'ECR registry URL'
    value: ${{ steps.login-ecr.outputs.registry }}
# runs:
   using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: GitHubActions-ECRLogin
    - name: Login to Amazon ECR
       id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
       shell: bash
#
    - name: Output registry info
       shell: bash
      run: |
         echo "Successfully logged into ECR"
        echo "Registry: ${{ steps.login-ecr.outputs.registry }}"
# Usage example:
steps:
  - uses: ./.github/actions/ecr-login
    with:
      aws-region: us-east-1
      role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
