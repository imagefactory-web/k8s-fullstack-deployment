# Reusable GitHub Actions Workflow: Build and Push Container Image to ECR
#
name: Build and Push to ECR
on:
  workflow_call:
    inputs:
      app_name:
        description: 'Application name (frontend or backend)'
         required: true
         type: string
       dockerfile_path:
        description: 'Path to Dockerfile'
         required: true
         type: string
       context_path:
        description: 'Build context path'
         required: true
         type: string
       ecr_repository:
        description: 'ECR repository name'
         required: true
         type: string
      aws_region:
        description: 'AWS region'
         required: false
         type: string
         default: 'us-east-1'
       environment:
        description: 'Environment (dev, staging, prod)'
         required: true
         type: string
    secrets:
      aws_access_key_id:
         required: true
      aws_secret_access_key:
         required: true
    outputs:
       image_tag:
        description: 'Built image tag'
        value: ${{ jobs.build.outputs.image_tag }}
       image_uri:
        description: 'Full ECR image URI'
        value: ${{ jobs.build.outputs.image_uri }}
jobs:
   build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_uri: ${{ steps.build-push.outputs.imageid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ inputs.aws_region }}
      - name: Login to Amazon ECR
         id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Extract metadata for Docker
         id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}
           tags: |
            type=sha,prefix=${{ inputs.environment }}-
             type=ref,event=branch
             type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
         id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile_path }}
           push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
           cache-from: type=gha
           cache-to: type=gha,mode=max
           build-args: |
            ENVIRONMENT=${{ inputs.environment }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-push.outputs.imageid }}
           format: 'sarif'
           output: 'trivy-results.sarif'
#
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
         if: always()
        with:
           sarif_file: 'trivy-results.sarif'
