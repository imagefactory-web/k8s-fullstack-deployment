# GitHub Actions Workflow: Terraform Plan and Apply
#
name: Terraform Infrastructure
on:
   workflow_dispatch:
    inputs:
       environment:
        description: 'Environment to deploy (dev, staging, prod)'
         required: true
         type: choice
         options:
           - dev
           - staging
           - prod
      action:
        description: 'Terraform action'
         required: true
         type: choice
         options:
           - plan
           - apply
           - destroy
   pull_request:
     paths:
       - 'terraform/**'
# permissions:
   contents: read
   pull-requests: write
   id-token: write (for OIDC authentication)
#
jobs:
   terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
     defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
         continue-on-error: true
#
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
         id: plan
        run: |
           terraform plan -out=tfplan -no-color
         continue-on-error: true
#
      - name: Save plan output
         if: github.event_name == 'pull_request'
        run: |
           terraform show -no-color tfplan > plan.txt
#
      - name: Comment PR with plan
         if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
           script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ github.event.inputs.environment || 'dev' }}/plan.txt', 'utf8');
            const output = `#### Terraform Plan 📖
             <details><summary>Show Plan</summary>
#
             \`\`\`
             ${plan}
             \`\`\`
#
             </details>
#
            *Pushed by: @${{ github.actor }}*`;
             github.rest.issues.createComment({
               issue_number: context.issue.number,
               owner: context.repo.owner,
               repo: context.repo.repo,
               body: output
             });
      - name: Terraform Apply
         if: |
           github.event.inputs.action == 'apply' &&
           github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
      - name: Terraform Destroy
         if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
      - name: Output cluster information
         if: github.event.inputs.action == 'apply'
        run: |
           terraform output -json > outputs.json
           echo "EKS Cluster Endpoint: $(terraform output -raw cluster_endpoint)"
          echo "Update kubeconfig with:"
           echo "aws eks update-kubeconfig --name $(terraform output -raw cluster_name) --region us-east-1"
#
      - name: Upload outputs
         if: github.event.inputs.action == 'apply'
        uses: actions/upload-artifact@v3
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}
          path: terraform/environments/${{ github.event.inputs.environment }}/outputs.json
