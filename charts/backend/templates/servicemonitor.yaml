# ServiceMonitor for Backend Prometheus Metrics
#
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "backend.fullname" . }}
  labels: {{ include "backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{ include "backend.selectorLabels" . | nindent 6 }}
   endpoints:
     - port: http
       path: /metrics
       interval: 30s
       scrapeTimeout: 10s
#
   namespaceSelector:
     matchNames:
      - {{ .Release.Namespace }}
{{- end }}
# Backend Metrics to Expose:
# - HTTP request duration histogram
# - HTTP request count by endpoint and status
# - Active HTTP connections
# - Database connection pool stats
# - Cache hit/miss ratio
# - Authentication success/failure rate
# - API error rate by endpoint
# - Response time percentiles (p50, p95, p99)
Implementation:
# - Use prom-client npm package
# - Expose /metrics endpoint
# - Include custom business metrics
