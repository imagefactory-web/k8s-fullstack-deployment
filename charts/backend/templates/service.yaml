---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}-active
  labels: {{ include "backend.labels" . | nindent 4 }}
    service-type: active
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{ include "backend.selectorLabels" . | nindent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}-preview
  labels: {{ include "backend.labels" . | nindent 4 }}
    service-type: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{ include "backend.selectorLabels" . | nindent 4 }}
