# Development environment overrides for backend
#
# replicaCount: 1
#
image:
   tag: dev
#
# ingress:
   enabled: true
   hosts:
     - host: api-dev.example.com
resources:
   limits:
     cpu: 500m
     memory: 512Mi
   requests:
     cpu: 250m
     memory: 256Mi
#
# autoscaling:
   enabled: false
#
env:
   NODE_ENV: development
   LOG_LEVEL: debug
   DB_HOST: dev-postgres.dev.svc.cluster.local
   REDIS_HOST: dev-redis.dev.svc.cluster.local
#
# postgresql:
   enabled: true (use in-cluster for dev)
#
# redis:
   enabled: true (use in-cluster for dev)
