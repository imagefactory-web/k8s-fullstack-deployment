# Argo Rollouts Resource for Blue-Green Deployment
#
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: Name derived from chart ({{ include "frontend.fullname" . }})
  labels: Standard Helm labels
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: Keep last 3 revisions
#
  selector:
     matchLabels: Match pods by app label
#
  template:
    metadata:
      annotations: Pod annotations, including checksum for config changes
      labels: Pod labels
    spec:
      serviceAccountName: {{ include "frontend.serviceAccountName" . }}
      securityContext: {{ toYaml .Values.podSecurityContext }}
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
             httpGet:
               path: /
               port: http
             initialDelaySeconds: 30
             periodSeconds: 10
          readinessProbe:
             httpGet:
               path: /
               port: http
             initialDelaySeconds: 5
             periodSeconds: 5
          resources: {{ toYaml .Values.resources }}
          securityContext: {{ toYaml .Values.securityContext }}
          env: Environment variables from values
           envFrom: Load from ConfigMap/Secret
#
  strategy:
    blueGreen:
      activeService: frontend-active (receives production traffic)
      previewService: frontend-preview (for testing blue/green)
      autoPromotionEnabled: false (manual promotion for production)
       autoPromotionSeconds: 30 (for non-prod environments)
      scaleDownDelaySeconds: 30 (time before scaling down old version)
       prePromotionAnalysis: Optional analysis before promotion
       postPromotionAnalysis: Optional analysis after promotion
