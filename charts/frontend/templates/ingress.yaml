# Kubernetes Ingress Resource
#
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "frontend.fullname" . }}
  labels: {{ include "frontend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
     - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
       http:
         paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
             backend:
               service:
                name: {{ include "frontend.fullname" $ }}-active
                 port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
# Notes:
# - Points to the -active service (managed by Argo Rollouts)
# - Configure annotations for AWS ALB, nginx, or other ingress controller
# - Include TLS configuration for HTTPS
# - Support multiple hosts and paths
