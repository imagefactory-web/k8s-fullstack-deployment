# Production environment overrides for frontend
#
# replicaCount: 3 (minimum for production HA)
#
image:
  tag: prod-{{ .Values.buildNumber }}
   pullPolicy: IfNotPresent
#
# ingress:
   enabled: true
   className: alb
  annotations:
     alb.ingress.kubernetes.io/scheme: internet-facing
     alb.ingress.kubernetes.io/target-type: ip
     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
   hosts:
     - host: frontend.example.com
     - host: www.example.com
  tls:
     - secretName: frontend-prod-tls
       hosts:
         - frontend.example.com
         - www.example.com
resources:
   limits:
     cpu: 1000m
     memory: 1Gi
   requests:
     cpu: 500m
     memory: 512Mi
#
# autoscaling:
   enabled: true
   minReplicas: 3
   maxReplicas: 10
   targetCPUUtilizationPercentage: 60
   targetMemoryUtilizationPercentage: 70
#
# podDisruptionBudget:
   enabled: true
   minAvailable: 2
#
# affinity:
   podAntiAffinity: Configure to spread pods across zones
#
env:
   NODE_ENV: production
   API_URL: https://api.example.com
   LOG_LEVEL: warn
