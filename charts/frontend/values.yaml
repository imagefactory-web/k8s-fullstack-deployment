# Default values for frontend Helm chart
# This file contains default configuration that can be overridden
#
# replicaCount: Number of pod replicas (default: 2 for HA)
#
image:
   repository: ECR repository URL for frontend image
   pullPolicy: Image pull policy (IfNotPresent, Always, Never)
   tag: Image tag (override with app version)
#
# imagePullSecrets: List of secrets for private registries
#
# nameOverride: Override chart name
fullnameOverride: Override full resource names
#
# serviceAccount:
   create: Whether to create a service account
  annotations: Service account annotations (for IRSA)
  name: Service account name
# podAnnotations: Annotations to add to pods
# podSecurityContext: Security context for pod
   fsGroup: File system group ID
   runAsNonRoot: true
#
# securityContext: Security context for container
  allowPrivilegeEscalation: false
   capabilities:
     drop: [ALL]
   readOnlyRootFilesystem: true
   runAsUser: 1000
#
# service:
   type: Service type (ClusterIP, LoadBalancer, NodePort)
   port: Service port (80)
   targetPort: Container port (80)
#
# ingress:
  enabled: Enable ingress resource
   className: Ingress class (nginx, alb)
  annotations: Ingress annotations
   hosts: List of host rules
  tls: TLS configuration
#
resources:
   limits:
     cpu: Maximum CPU (e.g., 500m)
     memory: Maximum memory (e.g., 512Mi)
   requests:
     cpu: Requested CPU (e.g., 250m)
     memory: Requested memory (e.g., 256Mi)
#
# autoscaling:
   enabled: Enable HPA
   minReplicas: Minimum replicas
   maxReplicas: Maximum replicas
   targetCPUUtilizationPercentage: CPU target for scaling
   targetMemoryUtilizationPercentage: Memory target for scaling
#
# nodeSelector: Node selection constraints
# tolerations: Pod tolerations
# affinity: Pod affinity rules
#
# livenessProbe: Liveness probe configuration
# readinessProbe: Readiness probe configuration
#
env: Environment variables
# envFrom: Environment from ConfigMap/Secret
